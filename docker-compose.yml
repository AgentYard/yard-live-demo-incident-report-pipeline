version: '3.8'
services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      timeout: 3s
  orchestrator:
    image: agentyard/orchestrator:latest
    ports:
    - 8080:8080
    environment:
      YARD_SYSTEM_ID: 63ab01ca-428d-42b5-ab17-ebbdab1131c1
      YARD_TRANSPORT: http
      YARD_REDIS_URL: redis://redis:6379
      YARD_ENGINE_TYPE: chain_executor
      YARD_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      redis:
        condition: service_healthy
  incident-commander:
    image: agentyard-incident-commander:latest
    environment:
      YARD_TRANSPORT: http
      YARD_SYSTEM_ID: 63ab01ca-428d-42b5-ab17-ebbdab1131c1
      YARD_NODE_ID: node-203b8d9b
      YARD_REDIS_URL: redis://redis:6379
      YARD_PORT: '9000'
      YARD_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      YARD_LLM_PROVIDER: bedrock
      YARD_AUTO_REGISTER: 'false'
      YARD_MEMORY: shared_bus
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - python -c "import urllib.request; urllib.request.urlopen('http://localhost:9000/health')"
      interval: 10s
      timeout: 5s
      retries: 3
    configs:
    - source: yard_cfg_node-203b8d9b
      target: /yard/config.yaml
  report-generator-agent:
    image: agentyard-report-generator-agent:latest
    environment:
      YARD_TRANSPORT: http
      YARD_SYSTEM_ID: 63ab01ca-428d-42b5-ab17-ebbdab1131c1
      YARD_NODE_ID: node-754256fa
      YARD_REDIS_URL: redis://redis:6379
      YARD_PORT: '9000'
      YARD_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      YARD_LLM_PROVIDER: bedrock
      YARD_AUTO_REGISTER: 'false'
      YARD_MEMORY: shared_bus
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - python -c "import urllib.request; urllib.request.urlopen('http://localhost:9000/health')"
      interval: 10s
      timeout: 5s
      retries: 3
    configs:
    - source: yard_cfg_node-754256fa
      target: /yard/config.yaml
networks:
  default:
    name: yard-live-demo-incident-report-pipeline
configs:
  yard_cfg_node-203b8d9b:
    file: ./yard-config-node-203b8d9b.yaml
  yard_cfg_node-754256fa:
    file: ./yard-config-node-754256fa.yaml
